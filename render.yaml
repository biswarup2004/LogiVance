services:
  - type: web
    name: shipment-tracker-api
    env: docker
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: shipment-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shipment-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: shipment-tracker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: shipment-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shipment-tracker-db
          property: password
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: shipment-tracker-db
    databaseName: shipment_tracker
    user: render_admin
    plan: free
